<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>مجموعة كورس العربي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #128c7e;
      --green-dark: #075e54;
      --green-soft: #d9fdd3;
      --whatsapp: #25d366;
      --bg: #edf8f3;
      --card: #ffffff;
      --text: #12251f;
      --muted: #5b726b;
      --danger: #c0392b;
      --shadow: 0 18px 50px rgba(7, 94, 84, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37, 211, 102, 0.18), transparent 28%),
        linear-gradient(180deg, #e8f6f1 0%, var(--bg) 45%, #dff3ea 100%);
      color: var(--text);
    }

    .page {
      width: min(460px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, var(--whatsapp), var(--green-dark));
      box-shadow: 0 12px 24px rgba(18, 140, 126, 0.28);
      color: white;
    }

    .logo svg {
      width: 38px;
      height: 38px;
      fill: currentColor;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
      line-height: 1.4;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 28px 22px 24px;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    input[type="tel"] {
      width: 100%;
      border: 1.5px solid #d7e6e1;
      background: #f7fbf9;
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="tel"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(18, 140, 126, 0.12);
      background: #fff;
    }

    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: var(--green);
      color: white;
    }

    .primary:hover:not(:disabled) {
      background: var(--green-dark);
    }

    .primary:disabled,
    input:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .whatsapp-btn {
      display: none;
      text-decoration: none;
      text-align: center;
      background: var(--whatsapp);
      color: #083322;
      margin-top: 14px;
    }

    .whatsapp-btn.show {
      display: block;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result.show {
      display: block;
    }

    .result.ok {
      background: var(--green-soft);
      color: #0b5b3a;
    }

    .result.err {
      background: #fdecea;
      color: var(--danger);
    }

    .result.warn {
      background: #fff4e5;
      color: #9a5b00;
    }

    .hint {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 0 0-8.66 15.06L2 22l5.12-1.28A10 10 0 1 0 12 2zm0 18.2a8.18 8.18 0 0 1-4.17-1.14l-.3-.18-3.04.76.81-2.96-.2-.31A8.2 8.2 0 1 1 12 20.2zm4.49-6.13c-.25-.12-1.45-.72-1.68-.8s-.39-.12-.55.12-.63.8-.78.96-.29.19-.54.06a6.7 6.7 0 0 1-1.97-1.21 7.38 7.38 0 0 1-1.36-1.69c-.14-.25 0-.38.11-.5s.25-.29.37-.44.16-.25.25-.41.04-.31-.02-.43-.55-1.32-.75-1.8-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.31 2.74 2.74 0 0 0-.86 2.04 4.77 4.77 0 0 0 1 2.53 10.9 10.9 0 0 0 4.18 3.68c.1.0.1.4 1.54.5a3.5 3.5 0 0 0 1.6-.21 2.62 2.62 0 0 0 1.15-1.16 2.16 2.16 0 0 0 .15-1.16c-.06-.1-.22-.16-.47-.28z"/>
        </svg>
      </div>
      <h1>مجموعة كورس العربي</h1>
      <p class="subtitle">سجّل رقمك عشان تدخل جروب الواتساب الخاص بيك</p>
    </section>

    <section class="card">
      <form id="join-form" autocomplete="on">
        <label for="phone">رقم التواصل</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          inputmode="tel"
          placeholder="مثال: 05xxxxxxxx أو 01xxxxxxxxx"
          required
        />
        <button id="submit-btn" class="primary" type="submit" disabled>عرض جروب الواتساب</button>
      </form>

      <div id="result" class="result" role="status"></div>
      <a id="group-link" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">دخول الجروب</a>
      <p id="hint" class="hint">جاري تحميل بيانات الطلبة من جوجل شيت...</p>
    </section>
  </main>

  <script src="app.js?v=7"></script>
</body>
</html>
